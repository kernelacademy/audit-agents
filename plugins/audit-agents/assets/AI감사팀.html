<title>AI감사팀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 위쪽 고정 막대(브랜드 · 질문 · 동기화 · 맡기기) 아래 흰 카드 한 장. 카드 안은 머리 배너(마스코트) → 보기 단추 → 고르는 보기.
   보기: 현황(고객사별 감사 건 · 토큰) · 질문과 답변 · 인차지 · 작업 기록 · 설정. 세션을 누르면 오른쪽 상세 창.
   디자인 토큰은 Kernel Academy 「오늘의 AI 비타민」(남색 글자, 옅은 초록 블록, 알약 단추, 남색 안내 띠)을 따른다. */
:root {
  --page: #f5f7f4;
  --card: #ffffff;
  --line: #dfe5db;
  --ink: #16264a;
  --body: #1f2937;
  --muted: #6b7280;
  --block: #f1f6ef;
  --leaf: #4b6b3f;
  --leaf-soft: #cfe0c7;
  --red: #b42318;
  --red-soft: #fdecea;
  --amber: #8a5a00;
  --amber-soft: #fbf0d9;
  --banner: #16264a;
  --banner-ink: #ffffff;
  --banner-sub: #dbe3f0;
  --on-ink: #ffffff;
  --plate: #f1f6ef;
  --plate-ink: #16264a;
  --plate-leaf: #4b6b3f;
  --plate-chip: #ffffff;
  --scrim: rgba(14, 22, 40, .42);
  --shadow: 0 12px 32px rgba(22, 38, 74, .16);
  --f-sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
  --f-serif: Georgia, "Times New Roman", serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0e1310; --card: #151b17; --line: #27302a; --ink: #dfe7f5; --body: #d5dbd6; --muted: #98a29b;
    --block: #1b241e; --leaf: #a9c79b; --leaf-soft: #34452d; --red: #f3968b; --red-soft: #3a1c19; --amber: #e5b65f; --amber-soft: #33270f;
    --banner: #1f3260; --banner-ink: #ffffff; --banner-sub: #c9d4ea; --on-ink: #0e1310;
    --scrim: rgba(0, 0, 0, .58); --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0e1310; --card: #151b17; --line: #27302a; --ink: #dfe7f5; --body: #d5dbd6; --muted: #98a29b;
  --block: #1b241e; --leaf: #a9c79b; --leaf-soft: #34452d; --red: #f3968b; --red-soft: #3a1c19; --amber: #e5b65f; --amber-soft: #33270f;
  --banner: #1f3260; --banner-ink: #ffffff; --banner-sub: #c9d4ea; --on-ink: #0e1310;
  --scrim: rgba(0, 0, 0, .58); --shadow: 0 12px 32px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--body); font-family: var(--f-sans); font-size: 15px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; }

/* 위쪽 막대 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
.top-in { max-width: 980px; margin: 0 auto; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.brand { display: inline-flex; align-items: center; gap: 8px; margin-right: auto; color: var(--ink); font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.brand img { width: 32px; height: 32px; }
.brand small { font-weight: 500; font-size: 12px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.pbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; white-space: nowrap; min-height: 34px; }
.pbtn:hover { border-color: var(--ink); }
.pbtn.solid { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.pbtn.warn { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.pbtn.quiet { color: var(--muted); }
.pbtn b { font-family: var(--f-mono); font-weight: 600; }
.pbtn.sm { padding: 3px 11px; font-size: 12px; min-height: 28px; }
.pbtn.danger { background: var(--red); border-color: var(--red); color: var(--on-ink); }
.pbtn:disabled { opacity: .45; cursor: default; }

/* 카드 */
main { max-width: 980px; margin: 0 auto; padding-block: 16px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.letter { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.hero { background: var(--plate) url(data:image/webp;base64,__HERO__) no-repeat right center / auto 100%; min-height: 210px; padding: 28px; display: flex; align-items: center; }
.hero-t { max-width: 52%; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.kick { margin: 0; display: inline-block; font-size: 12px; font-weight: 700; color: var(--plate-leaf); background: var(--plate-chip); border: 1px solid #cfe0c7; border-radius: 999px; padding: 2px 10px; }
.hero h1 { margin: 0; font-size: clamp(22px, 4.4vw, 27px); line-height: 1.38; font-weight: 800; color: var(--plate-ink); letter-spacing: -0.015em; }
.when { margin: 0; font-size: 13px; color: var(--plate-leaf); }
@media (max-width: 640px) {
  .hero { background-size: auto 140px; background-position: right -10px bottom; min-height: 0; padding: 22px 18px 140px; align-items: flex-start; }
  .hero-t { max-width: 100%; }
}
.inner { padding: 18px 28px 28px; display: flex; flex-direction: column; gap: 28px; min-width: 0; }
@media (max-width: 560px) { .inner { padding: 16px 16px 22px; } }
.tabs-wrap { overflow-x: auto; margin: -2px; padding: 2px; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); white-space: nowrap; }
.tabs button { border: 0; background: none; padding: 7px 16px; font-size: 13.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; min-height: 38px; }
.tabs button[aria-current="page"] { background: var(--ink); color: var(--on-ink); font-weight: 700; }
.tabs .n { font-family: var(--f-mono); font-size: 12px; background: var(--amber-soft); color: var(--amber); border-radius: 999px; padding: 0 7px; line-height: 18px; }
.banner { background: var(--amber-soft); color: var(--amber); border-radius: 12px; padding: 10px 16px; font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.banner.info { background: var(--block); color: var(--ink); }

/* 섹션 머리 */
.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sec-h .k { flex: none; width: 26px; height: 26px; border-radius: 999px; background: var(--ink); color: var(--on-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.sec-h h2 { margin: 0; font-size: 19px; line-height: 1.45; font-weight: 800; color: var(--ink); }
.sec-h .cnt { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.sec-h .end { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.note { font-size: 13px; color: var(--muted); margin: 0; max-width: 70ch; }

/* 상태 칸 */
.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tally button { border: 1px solid transparent; background: var(--block); border-radius: 12px; padding: 10px 14px; text-align: left; display: flex; flex-direction: column; gap: 0; color: var(--ink); }
.tally .v { font-family: var(--f-mono); font-size: 24px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; }
.tally .l { font-size: 12.5px; color: var(--muted); }
.tally .w { background: var(--amber-soft); }
.tally .w .v { color: var(--amber); }
.tally .f .v { color: var(--red); }
.tally button[aria-pressed="true"] { border-color: var(--ink); }
@media (max-width: 560px) { .tally { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* 상태 알약 */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.st-running { color: var(--ink); background: var(--card); border: 1px solid var(--ink); }
.st-running::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); animation: blink 1.4s ease-in-out infinite; }
.st-waiting { color: var(--amber); background: var(--amber-soft); }
.st-failed { color: var(--red); background: var(--red-soft); }
.st-done { color: var(--leaf); background: var(--card); border: 1px solid var(--line); }
.st-queued { color: var(--ink); background: var(--block); border: 1px dashed var(--muted); }
@keyframes blink { 50% { opacity: .25; } }

/* 고객사 묶음 */
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 12px; align-items: start; }
.case { background: var(--block); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.case-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.case-h h3 { margin: 0; font-size: 17px; font-weight: 800; color: var(--ink); line-height: 1.4; }
.case-h .cnt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: auto; }
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
.who.none { color: var(--muted); }
.av { width: 24px; height: 24px; border-radius: 50%; background: var(--leaf-soft); color: var(--ink); display: inline-grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
.av.lg { width: 40px; height: 40px; font-size: 17px; }
.path { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.sess { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.srow { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.srow:hover { border-color: var(--ink); }
.srow:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.srow.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.srow .tt { min-width: 0; display: flex; flex-direction: column; }
.srow .tt b { color: var(--ink); font-weight: 700; font-size: 14px; line-height: 1.45; }
.srow .tt small { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .tm { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (max-width: 480px) { .srow { grid-template-columns: minmax(0, 1fr) auto; } .srow .tt { grid-column: 1 / -1; grid-row: 2; } }
.more { all: unset; cursor: pointer; font-size: 12.5px; color: var(--leaf); font-weight: 600; padding: 2px 4px; }
.more:focus-visible { outline: 2px solid var(--ink); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { background: var(--block); border-radius: 12px; padding: 22px 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.empty b { color: var(--ink); font-size: 15px; }

/* 토큰 */
.tok { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; }
.tok .big { font-family: var(--f-mono); font-size: 28px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tok span { font-size: 13.5px; color: var(--muted); }
.tok span b { color: var(--ink); font-family: var(--f-mono); }
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.bars li { display: grid; grid-template-columns: minmax(90px, 180px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.bars .nm { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .track { height: 10px; background: var(--block); border-radius: 999px; overflow: hidden; }
.bars .track i { display: block; height: 100%; background: var(--leaf); border-radius: 999px; }
.bars .vv { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }

/* 남색 안내 띠 */
.promo { background: var(--banner); color: var(--banner-ink); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.promo .pk { margin: 0; font-size: 12px; color: #cfe0c7; }
.promo .pt { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.45; }
.promo .pd { margin: 0 0 8px; font-size: 14px; color: var(--banner-sub); max-width: 64ch; }
.promo button { border: 0; background: #ffffff; color: #16264a; border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 700; }

/* 질문과 답변 */
.qa { display: flex; flex-direction: column; gap: 8px; }
.qa details { background: var(--block); border-radius: 12px; }
.qa summary { padding: 12px 16px; cursor: pointer; list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary .q { color: var(--ink); font-weight: 700; }
.qa summary .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--muted); align-items: center; }
.qa summary::after { content: "+"; font-family: var(--f-mono); color: var(--leaf); grid-row: 1; grid-column: 2; }
.qa details[open] summary::after { content: "\2013"; }
.qa .body { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.qa .body p { margin: 0; max-width: 70ch; }
.said { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; font-size: 14px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.opts button:hover, .opts button[aria-pressed="true"] { border-color: var(--ink); }
textarea, .in, select.in { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 11px; color: var(--body); min-width: 0; }
textarea { min-height: 88px; resize: vertical; line-height: 1.55; }
textarea:focus, .in:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--leaf-soft); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.hint { font-size: 12.5px; color: var(--muted); }

/* 인차지 */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; align-items: start; }
.person { background: var(--block); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.person-h { display: flex; gap: 10px; align-items: center; }
.person-h h3 { margin: 0; font-size: 16px; color: var(--ink); font-weight: 800; }
.person-h small { display: block; font-size: 12.5px; color: var(--muted); }
.card-dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 13px; }
.card-dl dt { color: var(--leaf); font-weight: 700; white-space: nowrap; }
.card-dl dd { margin: 0; color: var(--body); min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; }
.counts { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
.counts b { font-family: var(--f-mono); color: var(--ink); }

/* 작업 기록 */
.logbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.logbar .in { width: auto; flex: 1 1 160px; }
.daynav { display: inline-flex; gap: 4px; align-items: center; }
.daynav button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); }
.daynav button:disabled { opacity: .35; cursor: default; }
.daynav select { width: auto; font-family: var(--f-mono); font-size: 13px; }
.lines { list-style: none; margin: 0; padding: 0; }
.lines li { display: grid; grid-template-columns: 52px 78px minmax(0, 1fr); gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: start; }
.lines li:last-child { border-bottom: 0; }
.lines time { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.lines .kd { font-size: 11.5px; font-weight: 700; justify-self: start; border-radius: 999px; padding: 0 9px; background: var(--block); color: var(--ink); white-space: nowrap; }
.lines .kd.k-done { color: var(--leaf); }
.lines .kd.k-fail { color: var(--red); background: var(--red-soft); }
.lines .kd.k-ans, .lines .kd.k-edit { color: var(--amber); background: var(--amber-soft); }
.lines .bd { min-width: 0; }
.lines .bd b { color: var(--ink); font-size: 14px; }
.lines .bd button { all: unset; cursor: pointer; color: var(--ink); font-weight: 700; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
.lines .bd p { margin: 0; font-size: 13px; color: var(--muted); }
@media (max-width: 480px) { .lines li { grid-template-columns: 46px minmax(0, 1fr); } .lines .bd { grid-column: 2; } }

/* 설정 */
.form-rows { display: flex; flex-direction: column; gap: 8px; }
.frow { background: var(--block); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr) minmax(0, 1.6fr) auto; gap: 8px; align-items: center; }
@media (max-width: 720px) { .frow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .frow .wide { grid-column: 1 / -1; } }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 12px; color: var(--leaf); font-weight: 700; }
.pform { background: var(--block); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.pform .wide { grid-column: 1 / -1; }
@media (max-width: 640px) { .pform { grid-template-columns: minmax(0, 1fr); } }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; font-size: 14px; }
.steps li::marker { color: var(--leaf); font-weight: 700; }

/* 상세 창 · 대화 상자 */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100%); z-index: 41; background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dlg { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(640px, calc(100% - 32px)); max-height: 86vh; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
@media (max-width: 640px) { .dlg { left: 0; right: 0; bottom: 0; top: auto; transform: none; width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); } }
.pane-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pane-h h2 { margin: 0; font-size: 16px; color: var(--ink); font-weight: 800; line-height: 1.4; }
.x { width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; padding: 0; flex: none; font-size: 18px; line-height: 1; }

.trail time { font-family: var(--f-mono); color: var(--muted); font-size: 12px; padding-top: 1px; }
.copy { margin: 0; background: var(--block); border-radius: 10px; padding: 12px 14px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; max-height: 260px; overflow-y: auto; color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 9px 18px; font-size: 13.5px; box-shadow: var(--shadow); max-width: min(560px, calc(100% - 32px)); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
.foot { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .st-running::before { animation: none; } .toast { transition: none; } }
</style>

<header class="top">
  <div class="top-in">
    <span class="brand"><img src="data:image/webp;base64,__MASCOT__" alt="" width="32" height="32">AI감사팀<small>감사 에이전트 현황</small></span>
    <div class="tools">
      <button class="pbtn quiet" id="askBtn" data-a="go" data-v="answers">질문 대기 <b id="askN">0</b></button>
      <button class="pbtn" data-a="sync">동기화</button>
      <button class="pbtn solid" data-a="new" data-v="">+ 새 세션 맡기기</button>
    </div>
  </div>
</header>
<main>
  <article class="letter">

      <div class="hero-t">
        <p class="kick">Kernel Academy · AI감사팀</p>
        <h1 id="headline">감사 세션을 불러오는 중입니다</h1>
        <p class="when" id="when"></p>
      </div>
    </section>
    <div class="inner">
      <div class="tabs-wrap"><nav class="tabs" id="tabs" aria-label="보기">

        <button data-a="go" data-v="people">인차지</button>

<p class="foot">토큰 금액은 API 단가로 환산한 추정값입니다. 구독 요금제의 실제 청구액과 다릅니다.</p>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="세션 상세" hidden></aside>
<div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-label="안내" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  "use strict";

  var STATUS = { waiting: "질문 대기", failed: "막힘", running: "실행 중", queued: "맡김", done: "끝남" };
  var RANK = { waiting: 0, failed: 1, running: 2, queued: 3, done: 4 };
  var COL = { act: "activities", person: "characters", client: "clients", ans: "answers" };
  var LIST = { act: "acts", person: "people", client: "clients", ans: "answers" };
  var VIEWS = ["home", "answers", "people", "log", "setup"];

  var S = {
    db: null, sample: false, ready: false, slow: false, readonly: false,
    acts: [], people: [], clients: [], answers: [], hub: {}, sync: {},
    view: "home", filter: "all", showDone: {}, drawer: "", dlg: null,
    drafts: {}, typing: {}, editAns: {}, confirm: "",
    logDay: "", logClient: "all", logPerson: "all", logQ: ""
  };

  /* 작은 도구 */
  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function when(s) { if (!s) return null; var d = new Date(s); return isNaN(d) ? null : d; }
  function two(n) { return (n < 10 ? "0" : "") + n; }
  function hhmm(d) { return d ? two(d.getHours()) + ":" + two(d.getMinutes()) : ""; }
  function mday(d) { return d ? (d.getMonth() + 1) + "월 " + d.getDate() + "일" : ""; }
  function ymd(d) { return d.getFullYear() + "-" + two(d.getMonth() + 1) + "-" + two(d.getDate()); }
  function took(ms) { var m = Math.max(0, Math.round(ms / 60000)); if (m < 60) return m + "분"; var h = Math.floor(m / 60); return h < 48 ? h + "시간 " + (m % 60) + "분" : Math.floor(h / 24) + "일"; }
  function newId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function nowIso() { return new Date().toISOString(); }
  function byOrder(a, b) { return (a.order || 0) - (b.order || 0); }
  function nextOrder(list) { return list.reduce(function (m, x) { return Math.max(m, x.order || 0); }, 0) + 1; }
  function get(kind, id) { var l = S[LIST[kind]]; for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i]; return null; }
  function num(n) { return Math.round(n).toLocaleString("ko-KR"); }
  function tokShort(n) { return n >= 10000 ? (n / 10000).toFixed(n >= 1000000 ? 0 : 1).replace(/\.0$/, "") + "만" : num(n); }
  function initial(name) { var s = String(name || "").trim(); return s ? Array.from(s)[0] : "·"; }
  function cut(s, n) { s = String(s || ""); return s.length > n ? s.slice(0, n) + "…" : s; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 3400); }
  function stPill(s) { return '<span class="st st-' + (STATUS[s] ? s : "running") + '">' + (STATUS[s] || "실행 중") + "</span>"; }

  /* 세션에서 고객사 · 인차지 읽기 */
  function norm(p) { return String(p || "").replace(/\\/g, "/").replace(/\/+$/, "").toLowerCase(); }
  function clientName(a) {
    if (a.client) return String(a.client);
    var w = norm(a.where);
    if (w) {
      for (var i = 0; i < S.clients.length; i++) {
        var f = norm(S.clients[i].folder);
        if (f && (w === f || w.indexOf(f + "/") === 0 || ("/" + w + "/").indexOf("/" + f + "/") >= 0)) return S.clients[i].name;
      }
    }
    var parts = String(a.where || "").split(/[\\/]/).filter(Boolean);
    for (var j = parts.length - 1; j > 0; j--) if (/^\d{4}\s/.test(parts[j])) return parts[j - 1];
    return "";
  }
  function clientByName(n) { for (var i = 0; i < S.clients.length; i++) if (S.clients[i].name === n) return S.clients[i]; return null; }
  function personOf(a) {
    var p = a.char ? get("person", a.char) : null;
    if (p) return p;
    var k = clientByName(clientName(a));
    return k && k.incharge ? get("person", k.incharge) : null;
  }
  function live() { return S.acts.filter(function (a) { return !a.imported; }); }
  function sorted(list) { return list.slice().sort(function (a, b) { return ((RANK[a.status] == null ? 2 : RANK[a.status]) - (RANK[b.status] == null ? 2 : RANK[b.status])) || ((when(b.start) || 0) - (when(a.start) || 0)); }); }
  function waiting() { return S.acts.filter(function (a) { return a.status === "waiting"; }).sort(function (a, b) { return (when(a.askedAt || a.start) || 0) - (when(b.askedAt || b.start) || 0); }); }
  function lastLine(a) { var s = a.steps || []; return s.length ? s[s.length - 1].text : ""; }
  function groups() {
    var names = [], seen = {};
    S.clients.slice().sort(byOrder).forEach(function (k) { if (!seen[k.name]) { seen[k.name] = 1; names.push(k.name); } });
    var rest = [];
    S.acts.forEach(function (a) { var n = clientName(a); if (n && !seen[n]) { seen[n] = 1; rest.push(n); } });
    names = names.concat(rest.sort(function (x, y) { return x.localeCompare(y, "ko"); }));
    if (S.acts.some(function (a) { return !clientName(a); })) names.push("");
    return names;
  }
  function budget() { var b = +S.hub.budgetUsd; return b > 0 ? b : 100; }

  /* 저장 */
  var chain = {};
  var warnedNoDb = false;
  function write(path, op, data) {
    if (S.sample) return;
    if (!S.db) { if (!warnedNoDb) { toast("저장 공간에 연결되지 않아 이 화면을 닫으면 바꾼 내용이 사라집니다."); warnedNoDb = true; } return; }
    chain[path] = (chain[path] || Promise.resolve()).then(function () {
      var ref = S.db.doc(path);
      var p = op === "delete" ? ref.delete() : op === "update" ? ref.update(data) : ref.set(data);
      return p.catch(function (e) {
        var c = e && e.code;
        if (c === "invalid_argument") { S.readonly = true; toast("이 화면을 볼 권한만 있어 저장하지 못했습니다. 소유자에게 편집 권한을 요청하세요."); render(); }
        else if (c === "quota_exceeded") toast("저장 공간이 가득 찼습니다. 끝난 세션 기록을 몇 개 지워 주세요.");
        else toast("저장하지 못했습니다. 잠시 뒤 다시 해 보세요.");
      });
    });
  }
  function strip(o) { var c = {}; Object.keys(o).forEach(function (k) { if (k !== "id") c[k] = o[k]; }); return c; }
  function add(kind, obj) { S[LIST[kind]].push(obj); write(COL[kind] + "/" + obj.id, "set", strip(obj)); render(); }
  function change(kind, id, data) {
    var l = S[LIST[kind]];
    for (var i = 0; i < l.length; i++) if (l[i].id === id) { l[i] = Object.assign({}, l[i], data); break; }
    write(COL[kind] + "/" + id, "update", data); render();
  }
  function drop(kind, id) { S[LIST[kind]] = S[LIST[kind]].filter(function (x) { return x.id !== id; }); write(COL[kind] + "/" + id, "delete"); }
  function saveHub(data) { S.hub = Object.assign({}, S.hub, data); write("settings/hub", "set", S.hub); render(); }

  /* 머리와 보기 */
  function render() {
    var a = document.activeElement, keep = null;
    if (a && a.id && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && /text|search|url|number/.test(a.type)))) { try { keep = { id: a.id, s: a.selectionStart, e: a.selectionEnd }; } catch (x) { keep = { id: a.id }; } }
    head(); $("view").innerHTML = S.ready ? ({ home: viewHome, answers: viewAnswers, people: viewPeople, log: viewLog, setup: viewSetup }[S.view])() : '<div class="empty"><b>불러오는 중입니다</b></div>';
    drawer(); dialog();
    document.body.classList.toggle("lock", !!S.dlg || (!!S.drawer && matchMedia("(max-width: 640px)").matches));
    if (keep) { var n = $(keep.id); if (n && n !== a) { n.focus({ preventScroll: true }); try { if (keep.s != null) n.setSelectionRange(keep.s, keep.e); } catch (x) { } } }
  }
  function head() {
    var w = waiting().length, acts = live(), g = groups().filter(Boolean).length;
    $("askN").textContent = w; $("askBtn").className = "pbtn " + (w ? "warn" : "quiet");
    $("tabN").hidden = !w; $("tabN").textContent = w;
    [].forEach.call(document.querySelectorAll("#tabs [data-v]"), function (b) { if (b.dataset.v === S.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    if (!S.ready) return;
    var run = acts.filter(function (a) { return a.status === "running"; }).length;
    $("headline").textContent = acts.length ? "고객사 " + g + "곳 · 인차지 세션 " + acts.length + "개" : (S.clients.length ? "고객사 " + S.clients.length + "곳을 정했습니다. 세션은 아직 없습니다" : "고객사와 인차지를 정하고 동기화하면 감사 세션이 여기에 올라옵니다");
    var ls = when(S.sync.lastSync);
    var bits = [];
    if (acts.length) bits.push("질문 대기 " + w + "건 · 실행 중 " + run + "건");
    bits.push(S.sample ? "예시 화면 · 저장되지 않음" : ls ? "마지막 동기화 " + mday(ls) + " " + hhmm(ls) : "아직 동기화하지 않음");
    $("when").textContent = bits.join(" · ");
  }
  function banners() {
    var h = "";
    if (S.sample) h += '<div class="banner info"><span>가상의 고객사로 만든 예시 화면입니다. 바꾼 내용은 저장되지 않습니다.</span><button class="pbtn sm" data-a="unsample">예시 닫기</button></div>';
    else if (!S.db) h += '<div class="banner"><span>저장 공간에 연결되지 않았습니다. claude.ai 에 저장 기능이 있는 아티팩트로 게시하고 로그인한 상태로 열어야 고객사와 세션이 저장됩니다.</span><button class="pbtn sm" data-a="sample">예시로 보기</button></div>';
    if (S.slow) h += '<div class="banner"><span>저장 공간 응답이 늦습니다. 보이는 내용이 최신이 아닐 수 있습니다.</span></div>';
    if (S.readonly) h += '<div class="banner"><span>보기 권한으로 열려 있습니다. 바꾼 내용은 저장되지 않습니다.</span></div>';
    return h;
  }
  function secHead(k, title, cnt, end) { return '<div class="sec-h">' + (k ? '<span class="k">' + k + "</span>" : "") + "<h2>" + esc(title) + "</h2>" + (cnt != null ? '<span class="cnt">' + esc(cnt) + "</span>" : "") + (end ? '<span class="end">' + end + "</span>" : "") + "</div>"; }
  function srow(a) {
    var sub = a.status === "waiting" && a.question ? "질문: " + a.question : a.status === "failed" && a.question ? "막힌 이유: " + a.question : lastLine(a) || a.prompt || "";
    var s = when(a.start);
    return '<li><button class="srow' + (S.drawer === a.id ? " on" : "") + '" data-a="open" data-v="' + esc(a.id) + '">' + stPill(a.status) + '<span class="tt"><b>' + esc(a.title || "제목 없는 세션") + "</b>" + (sub ? "<small>" + esc(sub) + "</small>" : "") + '</span><span class="tm">' + (s ? hhmm(s) + " · " + took((a.end ? when(a.end) : new Date()) - s) : "") + "</span></button></li>";
  }

  function viewHome() {
    var acts = live(), cnt = function (s) { return acts.filter(function (a) { return a.status === s; }).length; };
    var h = banners();
    var tiles = [["waiting", "질문 대기", "w"], ["running", "실행 중", ""], ["failed", "막힘", "f"], ["done", "끝남", ""]];
    h += '<div class="tally" role="group" aria-label="상태로 거르기">' + tiles.map(function (t) { return '<button class="' + t[2] + '" data-a="filter" data-v="' + t[0] + '" aria-pressed="' + (S.filter === t[0]) + '"><span class="v">' + cnt(t[0]) + '</span><span class="l">' + t[1] + "</span></button>"; }).join("") + "</div>";
    var names = groups();
    var flt = S.filter === "all" ? "" : '<button class="pbtn sm" data-a="filter" data-v="all">' + STATUS[S.filter] + "만 보는 중 · 풀기</button>";
    h += '<section class="sec">' + secHead("A", "고객사별 감사 건", names.filter(Boolean).length + "곳", flt + '<button class="pbtn sm" data-a="go" data-v="setup">고객사 설정</button>');
    if (!names.length) {
      h += '<div class="empty"><b>아직 고객사가 없습니다</b>설정에서 고객사 이름, 인차지, 연결 폴더(그 회사 감사 폴더)를 넣으면 고객사마다 세션 목록이 생깁니다. 연결 폴더에서 연 세션은 동기화할 때 그 고객사 아래에 모입니다.<button class="pbtn solid sm" data-a="go" data-v="setup">고객사 넣기</button></div>';
    } else {
      h += '<div class="cases">' + names.map(caseBox).join("") + "</div>";
    }
    h += "</section>" + tokens(acts);
    h += '<div class="promo"><p class="pk">세션을 이 화면에 올리려면</p><p class="pt">회사 폴더 세션에 동기화 문장을 붙여 넣습니다</p><p class="pd">이 화면은 PC 의 세션을 직접 읽지 못합니다. 회사 폴더에서 연 Claude Code 세션에 동기화 문장을 보내면, 그 세션이 상태 · 질문 · 토큰을 올리고 자기 질문에 남긴 답변을 읽어 갑니다.</p><button data-a="sync">동기화 문장 보기</button></div>';
    return h;
  }
  function caseBox(name) {
    var k = name ? clientByName(name) : null, p = k && k.incharge ? get("person", k.incharge) : null;
    var mine = sorted(S.acts.filter(function (a) { return clientName(a) === name; }));
    var vis = mine.filter(function (a) { return S.filter === "all" || a.status === S.filter; });
    var open = vis.filter(function (a) { return a.status !== "done"; }), done = vis.filter(function (a) { return a.status === "done"; });
    var key = name || "__none", showAll = !!S.showDone[key] || S.filter === "done";
    var shown = open.concat(showAll ? done : done.slice(0, 3));
    var h = '<section class="case"><div class="case-h"><h3>' + esc(name || "고객사 미지정") + "</h3>";
    if (name) h += p ? '<span class="who"><span class="av" aria-hidden="true">' + esc(initial(p.name)) + "</span>인차지 " + esc(p.name) + "</span>" : '<span class="who none">인차지 없음</span>';
    h += '<span class="cnt">세션 ' + mine.length + "</span></div>";
    if (name) h += '<p class="path">' + (k && k.folder ? esc(k.folder) : "연결 폴더 없음") + "</p>";
    h += shown.length ? '<ul class="sess">' + shown.map(srow).join("") + "</ul>" : '<p class="hint" style="margin:0">' + (mine.length ? "고른 상태의 세션이 없습니다" : "아직 올라온 세션이 없습니다") + "</p>";
    if (!showAll && done.length > 3) h += '<button class="more" data-a="more" data-v="' + esc(key) + '">끝난 세션 ' + (done.length - 3) + "개 더 보기</button>";
    if (name) h += '<div class="btns">' + (k ? '<button class="pbtn sm solid" data-a="new" data-v="' + esc(k.id) + '">+ 새 세션 맡기기</button>' : '<button class="pbtn sm solid" data-a="register" data-v="' + esc(name) + '">고객사로 등록</button>') + "</div>";
    return h + "</section>";
  }
  function tokens(acts) {
    var tot = 0, usd = 0, hasUsd = false, today = 0, tUsd = 0, by = {}, key = ymd(new Date());
    acts.forEach(function (a) {
      var t = +a.tokens || 0, u = +a.usd || 0, n = clientName(a) || "고객사 미지정";
      tot += t; usd += u; if (a.usd != null && a.usd !== "") hasUsd = true;
      by[n] = by[n] || { t: 0, u: 0 }; by[n].t += t; by[n].u += u;
      var s = when(a.start); if (s && ymd(s) === key) { today += t; tUsd += u; }
    });
